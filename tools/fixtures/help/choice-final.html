<h2 id="s1">A section</h2>

<div class="ex" id="a1" data-answer="3" data-hint="Expand the left side, then see what happens to x.">
  <div class="ex-q"><p>How many solutions does $3(x + 2) = 3x + 6$ have?</p></div>
  <ul class="choices">
    <li>Exactly one.</li>
    <li>None.</li>
    <li>Every number is a solution.</li>
    <li>Exactly two.</li>
  </ul>
  <div class="ex-solution"><p class="answer">Answer: every number</p><p>Expanding the left side gives $3x + 6$, the same as the right, <span data-final>so every number is a solution.</span></p></div>
</div>
