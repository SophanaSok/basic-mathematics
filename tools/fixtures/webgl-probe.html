<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL probe</title>
</head>
<body>
<pre id="out">probing…</pre>
<script>
/* Reports whether a WebGL 2 context can be created in this browser launch, and which
   renderer backs it. tools/suites/webgl.js reads window.__probe. WebGL 2 is the one
   context the site uses: assets/three-loader.js asks for "webgl2" and nothing else, since
   Three.js's renderer no longer runs on WebGL 1, so a launch that offers WebGL 1 alone
   draws no 3D picture and must count here as a launch without WebGL. */
(function () {
  var out = { ok: false, context: null, renderer: null, vendor: null, version: null, error: null };
  try {
    var c = document.createElement("canvas");
    var gl = null;
    try { gl = c.getContext("webgl2", { failIfMajorPerformanceCaveat: false }); } catch (e) { out.error = String(e); }
    if (gl) {
      out.context = "webgl2";
      out.ok = true;
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      out.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      out.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
      out.version = gl.getParameter(gl.VERSION);
      /* draw one triangle so a context that exists but cannot render is caught too */
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      var err = gl.getError();
      if (err !== gl.NO_ERROR) { out.ok = false; out.error = "gl error " + err; }
    }
  } catch (e) {
    out.error = String(e && e.message || e);
  }
  window.__probe = out;
  document.getElementById("out").textContent = JSON.stringify(out, null, 2);
})();
</script>
</body>
</html>
