# Checks every pull request and every push to main, deploys main to GitHub Pages, and
# deploys to Cloudflare Pages (main to production, a pull request to a preview).
#
#   build       the Node checks (npm run check, the Vitest unit tests among them), the
#               build, the checks on dist/, the legacy site and its checks; dist/ and
#               dist-legacy/ are kept as artifacts
#   browser     the Chromium checks that do not need WebGL, against that dist/, as one job
#               per part of tools/check-browser.js PARTS, side by side: each runs its part
#               of check-browser.js --skip=webgl, and the part "rest" (every suite no part
#               names) also the tools/game scripts of test:browser:core. With build, all of
#               these jobs are the gate a deploy waits for.
#   webgl       the 3D checks (the scene stages, the course map) and the WebGL suite.
#               WebGL on a runner is software rendering, slow and now and then losing its
#               context, so these are retried and are not part of the gate
#   deploy      main only: publishes to GitHub Pages that same dist/ (without the two
#               files only Cloudflare reads, _headers and 404.html), or, once the
#               repository variable SITE_CUTOVER is "true", dist-legacy/: the old address
#               then only sends readers, with their progress, to the new one
#   cloudflare  publishes that same dist/ to Cloudflare Pages with wrangler: a push to
#               main (or Run workflow) to production, a pull request from a branch of this
#               repository to a preview under the branch name pr-<number> (never its own
#               branch's name, which could be main), whose address goes into the job
#               summary and one comment on the pull request. A deploy from main that
#               Cloudflare did not make production (the project's production branch is not
#               main) fails the job. It needs the repository secrets
#               CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them, and for a
#               pull request from a fork (which is never given secrets), it says so in a
#               notice and deploys nothing, and the run stays green. The project is the
#               repository variable CLOUDFLARE_PROJECT_NAME, or PAGES_PROJECT in
#               src/carry/origins.ts when that is not set. It runs whatever SITE_CUTOVER
#               says, so the new address can be tried before the move.
#
# OPERATIONS.md, "Moving to Cloudflare Pages", is the owner's runbook for both variables
# and both secrets.
#
# deploy runs only while the repository's Pages source is "GitHub Actions" (Settings,
# Pages, Build and deployment, Source); pages-source asks. No other source works: the
# pages in the repository are not whole documents (the build writes their head and top
# bar, tools/lib/shell.js), so "Deploy from a branch" publishes pages with no stylesheets
# and no scripts. While the source is that, pages-source fails the run and says what to
# set. Setting the source back is therefore not a rollback; reverting the commit is.
# README.md, "Deploying".
#
# "Run workflow" on main (workflow_dispatch) runs all of this again and deploys, without
# a new commit: the manual way to publish, for instance right after switching the source.
#
# The browser checks need no network: the fonts, KaTeX, supabase-js and Three.js are npm
# dependencies in the bundle, served from the test server, and a page that asks another
# server for anything fails the pages suite (tools/lib/browser.js answers such a request
# under a deadline, so it cannot stall the run either).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for a branch or a pull request. A new push to a pull request replaces
# the run in progress. On main nothing in progress is cancelled: runs go one after another
# in the order of the pushes (of several waiting, only the newest is kept), so an older
# commit is never deployed after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # the browser job's matrix: the parts of check-browser.js
      browser-parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the progress-keys check reads the exercises of an old commit through git
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # exits 2, and fails the run, when a part names a suite that is not there
      - name: the parts of the browser checks
        id: parts
        run: |
          parts=$(node tools/check-browser.js --parts)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      # a pull request is judged against the branch it merges into, which need not be main
      - name: migrations against the merge target
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run check:static -- --only=migrations --migrations-base="origin/$BASE_REF"
      - run: npm run build
      - run: npm run check:dist
      - run: npm run build:legacy
      - run: npm run check:legacy
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # dist/.nojekyll
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: dist-legacy
          path: dist-legacy
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # One job per part, side by side (about 6 minutes each, where the one job took 16 to
  # 21): the parts come from the build job, so a part added to PARTS gets its job, and a
  # suite added to tools/suites/ runs in "rest" until it is given a part. Every suite of
  # --skip=webgl runs in exactly one of them, under the same flags as before, and as
  # before nothing here is retried. deploy and cloudflare need `browser`, which is every
  # one of these jobs.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # the others run to the end when one fails, so each part's report is there to read
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.build.outputs.browser-parts) }}
    env:
      # the tools/game scripts load the downloaded build, never the source tree
      BM_ROOT: dist
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the restore suite reads the pages of an old commit through git
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # the tools/game scripts go with the part "rest" (REST in check-browser.js), first
      - if: matrix.part == 'rest'
        run: npm run test:browser:core
      - name: npm run check:browser -- --skip=webgl --part=${{ matrix.part }}
        run: npm run check:browser -- --skip=webgl --part="$PART"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-browser-report-${{ matrix.part }}
          path: .cache/check
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  webgl:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BM_ROOT: dist
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: npm run test:browser:3d (up to three tries)
        run: |
          for try in 1 2 3; do
            if npm run test:browser:3d; then exit 0; fi
            echo "::warning::test:browser:3d failed on try $try"
          done
          exit 1
      - name: npm run check:browser -- --only=webgl (up to three tries)
        run: |
          for try in 1 2 3; do
            if npm run check:browser -- --only=webgl; then exit 0; fi
            echo "::warning::check:browser --only=webgl failed on try $try"
          done
          exit 1

  # main only: asks the repository which Pages source is set, so that `deploy` runs only
  # when it is "GitHub Actions". While it is still the branch this job fails, and the run
  # with it: Pages is then publishing the repository's files, which are not a whole site,
  # and a green run would hide that. If the question cannot be answered (the API refusing
  # or failing), it fails as well: a deploy is never skipped in a green run for a reason
  # nobody chose.
  pages-source:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # on an HTTP error gh prints the error body to stdout, so the value is only
          # used when the call succeeded
          if type=$(gh api "repos/$REPO/pages" --jq .build_type 2> pages-error.txt); then
            echo "build_type=$type" >> "$GITHUB_OUTPUT"
            if [ "$type" != "workflow" ]; then
              echo "::error::The Pages source is \"$type\", not GitHub Actions, so nothing is deployed from here and Pages is publishing the files of the branch. Those are not a whole site: each page gets its head and top bar from the build, and is served without stylesheets or scripts. Set Settings > Pages > Source to \"GitHub Actions\" and run this workflow on main."
              exit 1
            fi
          elif grep -q "HTTP 404" pages-error.txt; then
            echo "build_type=none" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for $REPO, so nothing is deployed from here."
          else
            echo "::error::Could not read the Pages source of $REPO, so nothing was deployed: $(tr '\n' ' ' < pages-error.txt)"
            exit 1
          fi

  deploy:
    # after the gate (every part of browser); webgl is deliberately not in `needs`
    if: needs.pages-source.outputs.build_type == 'workflow'
    needs: [build, browser, pages-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: to ask where main is, below
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A first attempt deploys in the order of the pushes (the concurrency group at the
      # top). Re-running the jobs of an old run is the one way an older dist/ could go
      # out over a newer one, so a re-run deploys only the commit main is still at.
      - name: A re-run deploys only the newest commit of main
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then
            echo "::error::main is at $head and this run built $SHA: re-running it would publish the older site. Re-run the newest run on main instead, or use Run workflow."
            exit 1
          fi
      # SITE_CUTOVER (Settings, Secrets and variables, Actions, Variables): unset or
      # "false", the course as it has always been; "true", the legacy site. Anything else
      # is a typo, and fails here rather than publish the wrong one.
      - name: Which site the old address serves (SITE_CUTOVER)
        id: which
        env:
          CUTOVER: ${{ vars.SITE_CUTOVER }}
        run: |
          case "$CUTOVER" in
            true)
              echo "artifact=dist-legacy" >> "$GITHUB_OUTPUT"
              echo "### GitHub Pages: the legacy site (SITE_CUTOVER is true)" >> "$GITHUB_STEP_SUMMARY"
              echo "Every old address now sends its reader, with the progress saved in their browser, to the same page at the new address (dist-legacy/, tools/build-legacy.js)." >> "$GITHUB_STEP_SUMMARY" ;;
            ""|false)
              echo "artifact=dist" >> "$GITHUB_OUTPUT"
              echo "### GitHub Pages: the course (SITE_CUTOVER is ${CUTOVER:-not set})" >> "$GITHUB_STEP_SUMMARY"
              echo "The full site, as before the move. Set the repository variable SITE_CUTOVER to true to publish the legacy site instead (OPERATIONS.md, \"Moving to Cloudflare Pages\")." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::The repository variable SITE_CUTOVER is \"$CUTOVER\". It must be true (publish the legacy site) or false or unset (publish the course); nothing was deployed."
              exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.which.outputs.artifact }}
          path: site
      # what only Cloudflare Pages reads stays off GitHub Pages, so the course goes out
      # there exactly as before the move (lib/headers.js)
      - name: Leave out _headers and 404.html
        if: steps.which.outputs.artifact == 'dist'
        run: rm -f site/_headers site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment

  # Cloudflare Pages, Direct Upload: the build is uploaded as it is, by
  # cloudflare/wrangler-action v4 (v4.1.3, 2026-09-24) running wrangler 4.147.0, pinned so
  # a new release of wrangler changes nothing here until it is chosen. The token needs one
  # permission, Account / Cloudflare Pages / Edit (developers.cloudflare.com, "Use Direct
  # Upload with continuous integration", read 2026-10-05). The project must exist first:
  # wrangler asks before it creates one, and in CI it cannot ask (it was created in the
  # dashboard; OPERATIONS.md 8.2 says how to check its production branch). No checkout: what is uploaded is the gate's dist/, and the branch and
  # commit are passed to wrangler, which would otherwise read them from git.
  cloudflare:
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the one comment with the preview's address
      pull-requests: write
    # one deploy at a time per branch or pull request, in order
    concurrency:
      group: cloudflare-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Can this run deploy?
        id: can
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          # unset, PAGES_PROJECT in src/carry/origins.ts (check-legacy.js `ci` holds the two together)
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'groundupmath' }}
        run: |
          project="$PROJECT"
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::No Cloudflare preview for a pull request from a fork: GitHub gives such a run no secrets."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::notice::Nothing deployed to Cloudflare Pages: the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set (OPERATIONS.md, \"Moving to Cloudflare Pages\")."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A pull request deploys under pr-<number>, never under its head branch's name:
          # wrangler makes a deploy production when the branch it is given is the project's
          # production branch, and a pull request whose head is main (main brought into
          # another branch) would otherwise replace the production site.
          if [ "$EVENT" = "pull_request" ]; then branch="pr-$PR_NUMBER"; sha="$PR_SHA"; else branch="$REF_NAME"; sha="$SHA"; fi
          # both go to wrangler on its command line: names made only of these, or no deploy
          if ! [[ "$project" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::The repository variable CLOUDFLARE_PROJECT_NAME is \"$project\", which is not a Cloudflare Pages project name (lower-case letters, digits and -); nothing was deployed."
            exit 1
          fi
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::notice::No Cloudflare preview for the branch \"$branch\": only letters, digits and . _ / - are passed to wrangler. Rename the branch for a preview."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "go=true"; echo "branch=$branch"; echo "sha=$sha"; echo "project=$project"; } >> "$GITHUB_OUTPUT"
      # As in deploy: re-running the jobs of an old run on main is the one way an older
      # dist/ could go out to production over a newer one, so a re-run deploys only the
      # commit main is still at.
      - name: A re-run deploys only the newest commit of main
        if: steps.can.outputs.go == 'true' && github.run_attempt > 1 && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then
            echo "::error::main is at $head and this run built $SHA: re-running it would publish the older site to Cloudflare Pages. Re-run the newest run on main instead, or use Run workflow."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        if: steps.can.outputs.go == 'true'
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.can.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy dist --project-name=${{ steps.can.outputs.project }} --branch=${{ steps.can.outputs.branch }} --commit-hash=${{ steps.can.outputs.sha }}
      - name: Say where it is
        if: steps.can.outputs.go == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          BRANCH: ${{ steps.can.outputs.branch }}
          PROJECT: ${{ steps.can.outputs.project }}
          SHA: ${{ steps.can.outputs.sha }}
          CUTOVER: ${{ vars.SITE_CUTOVER }}
        run: |
          {
            echo "### Cloudflare Pages: ${ENVIRONMENT:-deployed} ($PROJECT, branch $BRANCH)"
            echo "- This deployment: $URL"
            if [ -n "$ALIAS" ]; then echo "- The branch's address: $ALIAS"; fi
            echo "- Commit: $SHA"
            echo "- SITE_CUTOVER is ${CUTOVER:-not set}: the old address serves $([ "$CUTOVER" = "true" ] && echo "the legacy site, which sends readers here" || echo "the course itself, so this address is not yet where readers go")."
          } >> "$GITHUB_STEP_SUMMARY"
      # wrangler makes a deploy production only when --branch is the project's production
      # branch, and otherwise a preview, without an error. A project created in the
      # dashboard for Direct Upload has no setting for it there (OPERATIONS.md 8.2 says how
      # to read and set it), so a deploy from main that came out as anything else fails.
      - name: A deploy from main is production
        if: steps.can.outputs.go == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          PROJECT: ${{ steps.can.outputs.project }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ "$ENVIRONMENT" != "production" ]; then
            echo "::error::Cloudflare made this deploy of main a \"${ENVIRONMENT:-unknown}\" deployment ($URL), not production, so the custom domain still serves the previous production deployment (or nothing). The production branch of the project $PROJECT is not main: set it with the Cloudflare API (PATCH /accounts/<account id>/pages/projects/$PROJECT with {\"production_branch\":\"main\"}, OPERATIONS.md 8.2), then use Run workflow on main."
            exit 1
          fi
      # One comment per pull request, found again by its first line and updated in place.
      - name: Comment the preview's address on the pull request
        if: steps.can.outputs.go == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          SHA: ${{ steps.can.outputs.sha }}
        run: |
          marker="<!-- cloudflare-pages-preview -->"
          body="$marker
          **Preview on Cloudflare Pages** of $SHA: ${ALIAS:-$URL}
          (this deployment: $URL)

          Sign-in there works only if the preview address is on Supabase's redirect list (OPERATIONS.md, \"Moving to Cloudflare Pages\")."
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
